workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

stages:
  - build
  - test
  - release

build:
  stage: build
  image: node:24-slim
  rules:
    - changes:
        paths:
          - 'dist/**'
          - 'src/**'
          - .gitlab-ci.yml
    - when: manual
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/**

