workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

include:
  # include the local convert-weblate-csv template and pass inputs to create a test job
  - local: templates/convert-weblate-csv.yml
    inputs:
      job_name: convert-weblate-csv
      stage: test
      invert: false
      multi: false
      input: test/single/original/localization_*.csv
      output: test/single/weblate/localization_*.csv
      artifact: test/single/weblate/localization_*.csv

stages:
  - build
  - test
  - release

ensure-csv-converted:
  stage: test
  image: badouralix/curl-jq
  rules:
    # project must be public for `curl` to access the API; using `CI_JOB_TOKEN` is insufficient!
    - if: $CI_PROJECT_VISIBILITY != "public"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always
  script: |
    url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs"
    curl --fail --show-error --silent "$url" |
    jq --exit-status 'map(select(.name | contains("component job of my-component") or contains("convert-weblate-csv"))) | length >= 1'

verify-conversion:
  stage: test
  image: alpine:latest
  needs:
    - job: convert-weblate-csv
      artifacts: true
  rules:
    - when: always
  script:
    - apk add --no-cache diffutils
    - echo "Comparing expected vs produced files"
    - if [ ! -f test/single/weblate/localization_ja.csv ]; then echo "Produced file not found" && exit 2; fi
    - if [ ! -f test/single/original/localization_ja_expected.csv ]; then echo "Expected file not found" && exit 2; fi
    - diff -u test/single/original/localization_ja_expected.csv test/single/weblate/localization_ja.csv || (echo "Conversion mismatch" && exit 1)

