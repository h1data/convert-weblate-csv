# include the local convert-weblate-csv template and pass inputs to create a test job
include:
  - local: templates/convert-weblate-csv.yml
    rules:
      - changes:
          paths:
            - dist/**
            - src/**
            - test/**
            - .gitlab-ci.yml
    inputs:
      stage: test
      job_name: convert-single-original-to-weblate
      invert: false
      multi: false
      input: test/single/original/localization_ja.csv
      output: test/single/weblate/localization_ja.csv
      stats_file: test/single/weblate/stats.txt
      columns: context,source,target,developer_comments
      header: true
      encoding: utf8
      utf_bom: false
      crlf: CRLF
      separator: ","
      obsolete: true
      quoting: false

verify-conversion-single-original-to-weblate:
  stage: test
  image: alpine:latest
  needs:
    - job: convert-single-original-to-weblate
      optional: true
      artifacts: true
  rules:
    - changes:
        paths:
          - dist/**
          - src/**
          - test/**
          - .gitlab-ci.yml
  script:
    - apk add --no-cache diffutils
    - echo "Comparing expected vs produced CSVs"
    - if [ ! -f test/single/weblate/localization_ja.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/single/weblate/localization_ja_expected.csv test/single/weblate/localization_ja.csv || (echo "CSV conversion mismatch" && exit 1)
    - echo "Comparing expected vs produced stats"
    - if [ ! -f test/single/weblate/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
    - diff -u test/single/weblate/stats_expected.txt test/single/weblate/stats.txt || (echo "Stats conversion mismatch" && exit 1)

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script: echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG of components repository $CI_PROJECT_PATH"
