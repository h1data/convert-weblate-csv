stages:
  - build
  - test

build:
  stage: build
  image: node:24-alpine
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - .gitlab-ci.yml
  before_script:
    - apk add --no-cache git
    - git config --global user.name "gitlab-ci[bot]"
    - git config --global user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
    - git checkout "$CI_COMMIT_REF_NAME"
  script:
    - npm ci
    - npm run build
    - npm run build:github
    - npm run build:gitlab
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add .
        git commit -m "[ci skip] updated by CI build"
        git push -f origin HEAD:$CI_COMMIT_REF_NAME
      else
        echo "no change after build"
      fi
  artifacts:
    paths:
      - dist/**

test-single-original-to-weblate:
  stage: test
  image: node:24-alpine
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - test/**/*
          - .gitlab-ci.yml
  variables:
    INPUT_INVERT: false
    INPUT_MULTI: false
    INPUT_ORIGINAL_CSV: test/single/original/localization_ja.csv
    INPUT_WEBLATE_CSV: test/single/weblate/localization_ja.csv
    INPUT_STATS_FILE: test/single/weblate/stats.txt
    INPUT_COLUMNS: context,source,target,developer_comments
    INPUT_HEADER: false
    INPUT_ENCODING: utf8
    INPUT_UTF_BOM: false
    INPUT_LINEFEED: CRLF
    INPUT_SEPARATOR: ","
    INPUT_OBSOLETE: true
    INPUT_QUOTING: false
  before_script:
    - apk add --no-cache diffutils
  script:
    - node dist/gitlab/index.js
    - echo "Comparing expected vs produced CSVs"
    - if [ ! -f test/single/weblate/localization_ja.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/single/weblate/localization_ja_expected.csv test/single/weblate/localization_ja.csv || (echo "CSV conversion mismatch" && exit 1)
    - echo "Comparing expected vs produced stats"
    - if [ ! -f test/single/weblate/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
    - diff -u test/single/weblate/stats_expected.txt test/single/weblate/stats.txt || (echo "Stats conversion mismatch" && exit 1)

test-single-weblate-to-original:
  stage: test
  image: node:24-alpine
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - test/**/*
          - .gitlab-ci.yml
  variables:
    INPUT_INVERT: true
    INPUT_MULTI: false
    INPUT_ORIGINAL_CSV: test/single/original/localization_ja.csv
    INPUT_WEBLATE_CSV: test/single/weblate/localization_ja.csv
    INPUT_OUTPUT_CSV: test/single/original/localization_ja_out.csv
    INPUT_STATS_FILE: test/single/original/stats.txt
    INPUT_COLUMNS: context,source,target,developer_comments
    INPUT_HEADER: false
    INPUT_ENCODING: utf8
    INPUT_UTF_BOM: true
    INPUT_LINEFEED: CRLF
    INPUT_SEPARATOR: ","
    INPUT_OBSOLETE: true
    INPUT_QUOTING: false
  before_script:
    - apk add --no-cache diffutils
  script:
    - node dist/gitlab/index.js
    - if [ ! -f test/single/original/localization_ja_out.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/single/original/localization_ja_expected.csv test/single/original/localization_ja_out.csv || (echo "CSV conversion mismatch" && exit 1)
    - echo "Comparing expected vs produced stats"
    - if [ ! -f test/single/original/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
