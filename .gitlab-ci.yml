  stage: test
  image: node:24-alpine
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - test/**/*
          - .gitlab-ci.yml
  variables:
    INPUT_INVERT: true
    INPUT_MULTI: true
    INPUT_ORIGINAL_CSV: test/multi/original/localization.csv
    INPUT_WEBLATE_CSV: test/multi/weblate/localization_*.csv
    INPUT_OUTPUT_CSV:  test/multi/original/localization_out.csv
    INPUT_STATS_FILE: test/multi/original/stats.txt
    INPUT_COLUMNS: context,source,target,developer_comments
    INPUT_OBSOLETE: true
  before_script:
    - apk add --no-cache diffutils
  script:
    - node dist/gitlab/index.js
    - if [ ! -f test/multi/original/localization_out.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/multi/original/localization_expected.csv test/multi/original/localization_out.csv || (echo "CSV conversion mismatch" && exit 1)
    - if [ ! -f test/multi/original/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
    - diff -u test/multi/original/stats_expected.txt test/multi/original/stats.txt || (echo "Stats conversion mismatch" && exit 1)

test-cli:
  stage: test
  image: node:24-alpine
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - test/**/*
          - .gitlab-ci.yml
  before_script:
    - apk add --no-cache diffutils git
  script:
    - |
      node dist/index.js \
        --original-csv test/single/original/localization_ja.csv \
        --weblate-csv test/single/weblate/localization_ja.csv \
        --stats-file test/single/weblate/stats.txt \
        --columns context,source,target,developer_comments \
        --no-header --obsolete
    - echo "Comparing expected vs produced CSVs"
    - if [ ! -f test/single/weblate/localization_ja.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/single/weblate/localization_ja_expected.csv test/single/weblate/localization_ja.csv || (echo "CSV conversion mismatch" && exit 1)
    - echo "Comparing expected vs produced stats"
    - if [ ! -f test/single/weblate/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
    - diff -u test/single/weblate/stats_expected.txt test/single/weblate/stats.txt || (echo "Stats conversion mismatch" && exit 1)
    - git checkout test/*
    - |
      node dist/index.js \
        --invert \
        --original-csv test/single/original/localization_ja.csv \
        --weblate-csv test/single/weblate/localization_ja.csv \
        --output-csv test/single/original/localization_ja_out.csv \
        --stats-file test/single/original/stats.txt \
        --columns context,source,target,developer_comments \
        --utf-bom --no-header --obsolete
    - if [ ! -f test/single/original/localization_ja.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/single/original/localization_ja_expected.csv test/single/original/localization_ja_out.csv || (echo "CSV conversion mismatch" && exit 1)
    - echo "Comparing expected vs produced stats"
    - if [ ! -f test/single/original/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
    - diff -u test/single/original/stats_expected.txt test/single/original/stats.txt || (echo "Stats conversion mismatch" && exit 1)
