workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

stages:
  - build
  - test
  - release

build:
  stage: build
  image: node:24
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - .gitlab-ci.yml
  before_script:
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git checkout "$CI_COMMIT_REF_NAME"
  script:
    - npm ci
    - npm run build
    - |
      if [ -n "$(git status --porcelain)" ]; then
        git add .
        git commit -m "[ci skip] updated by CI build"
        git push -f origin HEAD:$CI_COMMIT_REF_NAME
      else
        echo "no change after build"
      fi
  artifacts:
    paths:
      - dist/**

include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/convert-weblate-csv@$CI_COMMIT_SHA
    rules:
      - changes:
          paths:
            - dist/**/*
            - src/**/*
            - test/**/*
            - .gitlab-ci.yml
    inputs:
      stage: test
      job_name: convert-single-original-to-weblate
      invert: false
      multi: false
      input: test/single/original/localization_ja.csv
      output: test/single/weblate/localization_ja.csv
      stats_file: test/single/weblate/stats.txt
      columns: context,source,target,developer_comments
      header: true
      encoding: utf8
      utf_bom: false
      crlf: CRLF
      separator: ","
      obsolete: true
      quoting: false
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/convert-weblate-csv@main
    rules:
      - changes:
          paths:
            - dist/**/*
            - src/**/*
            - test/**/*
            - .gitlab-ci.yml
    inputs:
      stage: test
      job_name: convert-single-weblate-to-original
      invert: true
      multi: false
      input: test/single/weblate/localization_ja.csv
      output: test/single/original/localization_ja.csv
      stats_file: test/single/original/stats.txt
      columns: context,source,target,developer_comments
      header: true
      encoding: utf8
      utf_bom: true
      crlf: CRLF
      separator: ","
      obsolete: true
      quoting: false

verify-conversion-single-original-to-weblate:
  stage: test
  image: alpine:latest
  needs:
    - job: convert-single-original-to-weblate
      optional: true
      artifacts: true
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - test/**/*
          - .gitlab-ci.yml
  script:
    - apk add --no-cache diffutils
    - echo "Comparing expected vs produced CSVs"
    - if [ ! -f test/single/weblate/localization_ja.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/single/weblate/localization_ja_expected.csv test/single/weblate/localization_ja.csv || (echo "CSV conversion mismatch" && exit 1)
    - echo "Comparing expected vs produced stats"
    - if [ ! -f test/single/weblate/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
    - diff -u test/single/weblate/stats_expected.txt test/single/weblate/stats.txt || (echo "Stats conversion mismatch" && exit 1)

verify-conversion-single-weblate-to-original:
  stage: test
  image: alpine:latest
  needs:
    - job: convert-single-weblate-to-original
      optional: true
      artifacts: true
  rules:
    - changes:
        paths:
          - dist/**/*
          - src/**/*
          - test/**/*
          - .gitlab-ci.yml
  script:
    - apk add --no-cache diffutils
    - echo "Comparing expected vs produced CSVs"
    - if [ ! -f test/single/original/localization_ja.csv ]; then echo "Produced CSV not found" && exit 2; fi
    - diff -u test/single/original/localization_ja_expected.csv test/single/original/localization_ja.csv || (echo "CSV conversion mismatch" && exit 1)
    - echo "Comparing expected vs produced stats"
    - if [ ! -f test/single/original/stats.txt ]; then echo "Produced stats not found" && exit 2; fi
    - diff -u test/single/original/stats_expected.txt test/single/original/stats.txt || (echo "Stats conversion mismatch" && exit 1)

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script: echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG of components repository $CI_PROJECT_PATH"
