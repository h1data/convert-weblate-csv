spec:
  inputs:
    stage:
      description: The stage to be executed
      default: convert
    job_name:
      description: The job name
      default: job-template
    artifacts:
      description: Define the artifacts i.e. converted CSV and stats.txt
    invert:
      description: Whether inverse conversion from Weblate CSV to the original CSV or not
      type: boolean
    multi:
      description: Whether the original CSV contains multiple languages to translate
      type: boolean
    input:
      description: Input file pattern (* for language code)
    output:
      description: Output file pattern (* for language code)
    stats_file:
      description: Stats file path
      default: stats.txt
    columns:
      description: Column list as Weblate CSV (context, source, target...) 
    header:
      description: Whether if the original CSV has header
      type: boolean
      default: true
    encoding:
      description: Specifies encoding of the original CSV
      default: utf8
    utf_bom:
      description: Whether if the original CSV has BOM when its encoding is UTF8
      type: boolean
      default: false
    crlf:
      description: Whether if the linefeed of the original CSV is CRLF or LF
      options:
        - CRLF
        - LF
      default: CRLF
    separator:
      description: Specifies the separator of the original CSV
      default: ","
    obsolete:
      description: Whether adding obsoleted rows for CSVs for Weblate
      type: boolean
      default: true
    overwrite:
      description: Whether overwriting existed translations of CSVs for Weblate
      type: boolean
      default: false
    quoting:
      description: Whether if always quoting every column in the original CSV
      type: boolean
      default: false

---
$[[ inputs.job_name ]]:
  image: node:latest
  stage: $[[ inputs.stage ]]
  variables:
    INVERT: "$[[ inputs.invert ]]"
    MULTI: "$[[ inputs.multi ]]"
    INPUT: "$[[ inputs.input ]]"
    OUTPUT: "$[[ inputs.output ]]"
    COLUMNS: "$[[ inputs.columns ]]"
    HEADER: "$[[ inputs.header ]]"
    ENCODING: "$[[ inputs.encoding ]]"
    CRLF: "$[[ inputs.crlf ]]"
    SEPARATOR: "$[[ inputs.separator ]]"
    STATS_FILE: "$[[ inputs.stats_file ]]"
    OBSOLETE: "$[[ inputs.obsolete ]]"
    OVERWRITE: "$[[ inputs.overwrite ]]"
    QUOTING: "$[[ inputs.quoting ]]"
  script:
    - echo "Starting job $[[ inputs.job_name ]]"
    - node dist/index.js
  artifacts:
    paths:
      - "$[[ inputs.artifacts ]]"
    when: always
